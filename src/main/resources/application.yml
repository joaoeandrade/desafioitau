# =====================================================================
# Configuração base. Valores sensíveis e de ambiente vêm de variáveis
# de ambiente (12-factor). Perfis: local, prod.
# =====================================================================
spring:
  application:
    name: event-platform

  threads:
    virtual:
      enabled: true   # Java 21: threads virtuais no Tomcat, listeners e @Async

  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/events?reWriteBatchedInserts=true}
    username: ${DB_USER:events}
    password: ${DB_PASSWORD:events}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 2000
      max-lifetime: 1800000
      pool-name: events-pool
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 3

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 50ms          # idempotência é otimização: não pode custar latência
      connect-timeout: 500ms
      lettuce:
        pool:
          enabled: false     # Lettuce multiplexa uma conexão; pool raramente ajuda

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
      batch-size: 65536
      properties:
        enable.idempotence: true
        linger.ms: 5                 # agrupa mensagens: +throughput com custo de ~5ms
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1000
      fetch-min-size: 65536
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        fetch.max.wait.ms: 50
        isolation.level: read_committed
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: batch
      observation-enabled: true
    template:
      observation-enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
          audiences: event-platform

server:
  port: 8080
  shutdown: graceful
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 2KB
  tomcat:
    max-connections: 10000
    accept-count: 200
    keep-alive-timeout: 30s
    max-keep-alive-requests: 1000

management:
  server:
    port: 8081               # porta interna; não exposta pelo Ingress
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,kafka
        liveness:
          include: livenessState
  health:
    redis:
      enabled: false         # Redis é opcional (fail-open); não deve afetar health
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.05}   # 5% em produção a 20k rps já dá visibilidade ampla
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      application: ${spring.application.name}

# Logs JSON (ECS) são ativados no perfil prod ou via LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs.
logging:
  level:
    root: INFO
    org.apache.kafka: WARN

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      downstream:
        sliding-window-type: TIME_BASED
        sliding-window-size: 30
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      downstream:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.client.HttpClientErrorException
  bulkhead:
    instances:
      downstream:
        max-concurrent-calls: 64
        max-wait-duration: 100ms

platform:
  kafka:
    ingested-topic: events.ingested.v1
    processed-topic: events.processed.v1
    partitions: ${KAFKA_PARTITIONS:24}
    replicas: ${KAFKA_REPLICAS:3}
    persistence-concurrency: ${PERSISTENCE_CONCURRENCY:4}
    integration-concurrency: ${INTEGRATION_CONCURRENCY:4}
  ingestion:
    publish-timeout: 150ms     # orçamento de latência: p95 alvo < 200ms
    max-clock-skew: 5m
    max-batch-size: 500
  idempotency:
    enabled: true
    ttl: 6h                    # janela de reenvio do cliente; ver docs/capacity-planning.md
    key-prefix: "ep:idem:"
  integration:
    enabled: ${INTEGRATION_ENABLED:false}
    webhook-url: ${INTEGRATION_WEBHOOK_URL:http://localhost:9999/events}
    webhook-secret: ${INTEGRATION_WEBHOOK_SECRET:}
    subscribed-types: []
    connect-timeout: 1s
    read-timeout: 3s
  security:
    dev-hmac-secret: ${DEV_HMAC_SECRET:}
  http:
    max-request-bytes: 4194304
