apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-platform
  labels: {app: event-platform}
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0          # nunca reduz capacidade durante deploy
  selector:
    matchLabels: {app: event-platform}
  template:
    metadata:
      labels: {app: event-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: event-platform
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: event-platform}
      containers:
        - name: app
          image: registry.example.com/event-platform:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          envFrom:
            - configMapRef: {name: event-platform-config}
            - secretRef: {name: event-platform-secrets}
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError"
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {memory: 2Gi}      # sem limite de CPU: evita throttling do CFS que degrada o p95
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # Dá tempo para o endpoint sair do balanceador antes do shutdown gracioso.
              sleep: {seconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
