apiVersion: v1
kind: Service
metadata:
  name: event-platform
  labels: {app: event-platform}
spec:
  selector: {app: event-platform}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Porta de gerenciamento exposta apenas dentro do cluster (Prometheus).
apiVersion: v1
kind: Service
metadata:
  name: event-platform-management
  labels: {app: event-platform, monitoring: "true"}
spec:
  selector: {app: event-platform}
  clusterIP: None
  ports:
    - {name: management, port: 8081, targetPort: management}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-platform
