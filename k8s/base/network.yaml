apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
    nginx.ingress.kubernetes.io/limit-rps: "2000"         # proteção por IP de origem
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [events.example.com]
      secretName: events-tls
  rules:
    - host: events.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: event-platform, port: {name: http}}
---
# Zero trust: só o Ingress fala com a porta HTTP; só o Prometheus com a porta de gerenciamento.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event-platform
spec:
  podSelector:
    matchLabels: {app: event-platform}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{port: 8080}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8081}]
