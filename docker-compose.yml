# Ambiente local completo: infraestrutura + observabilidade.
#   docker compose up -d                      # apenas infraestrutura
#   docker compose --profile app up -d --build # infraestrutura + aplicação
name: event-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    command: >
      postgres
        -c shared_buffers=512MB
        -c max_wal_size=4GB
        -c synchronous_commit=on
        -c wal_compression=on
        -c max_connections=200
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl", "--save", ""]
    ports: ["6379:6379"]

  # ---------- Observabilidade ----------
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092"]
    depends_on: [kafka]

  # ---------- Aplicação ----------
  app:
    profiles: [app]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/events?reWriteBatchedInserts=true
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports: ["8080:8080", "8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
