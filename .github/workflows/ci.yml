name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes unitários + arquitetura + cobertura
        run: mvn -B verify

      - name: Testes de integração (Testcontainers)
        run: mvn -B verify -Pintegration

      - name: Relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco

  image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: event-platform:${{ github.sha }}
      - name: Varredura de vulnerabilidades
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: event-platform:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
