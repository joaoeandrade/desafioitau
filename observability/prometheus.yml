global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: event-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8081                    # aplicação rodando no compose (--profile app)
          - host.docker.internal:8081   # aplicação rodando na IDE / mvn spring-boot:run

  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
